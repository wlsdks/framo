# 릴리스: 버전 태그(v0.5.0 같은)를 올리면 그 커밋에서 검수(ci.yml)를 다 다시 돌리고(세 운영체제 × Node 둘, 윈도우 배포본 켜 보기),
# 검수가 켜 본 윈도우용 zip과 맥용 zip을 GitHub 릴리스에 붙인다.
# 앱의 '새 버전' 알림은 이 릴리스(github.com/wlsdks/gyeol)만 보고, zip의 SHA-256(GitHub가 붙이는 digest)을 확인한 뒤에 받는다.
# 윈도우용은 윈도우 러너에서 묶어 Framo.exe의 파일 정보를 윈도우에서 직접 읽어 확인한다(scripts/exe.mjs, resedit는 어디서나 돈다).
# 올리는 법: package.json의 version을 고치고 커밋한 뒤 `git tag v0.5.0 && git push origin v0.5.0`
# 쓰기 권한은 릴리스를 만드는 일(publish) 하나만 받는다. 그 일은 저장소의 코드나 npm 꾸러미를 돌리지 않고 받은 zip과 gh만 쓴다.
# PR에서 이 파일, 검수, 묶는 스크립트를 고치면 릴리스 연습을 돈다: 릴리스만 만들지 않고 나머지를 다 해 본다.

name: 릴리스

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - scripts/pack.mjs
      - scripts/zip.mjs
      - scripts/exe.mjs
      - launch/**

permissions:
  contents: read

jobs:
  version:
    name: 태그와 package.json 버전이 같은지
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 태그와 버전
        run: |
          want="v$(jq -r .version package.json)"
          echo "package.json: $want"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "$want" ]; then echo "태그 $GITHUB_REF_NAME 와 package.json 버전 $want 이 달라요"; exit 1; fi

  check:
    name: 검수
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  mac:
    name: 맥용 묶기
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run pack -- --only mac
      - uses: actions/upload-artifact@v7
        with:
          name: gyeol-mac
          path: release/gyeol-mac.zip
          if-no-files-found: error
          retention-days: 3

  publish:
    name: 릴리스 만들기
    needs: [check, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gyeol-windows
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: gyeol-mac
          path: release
      # 받은 사람이 확인할 수 있게 해시도 적어 둔다 (앱은 GitHub가 붙이는 digest로 확인한다)
      - name: 해시 적기
        run: |
          (cd release && sha256sum gyeol-windows.zip gyeol-mac.zip) > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: 릴리스 만들기
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/gyeol-windows.zip release/gyeol-mac.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Framo $GITHUB_REF_NAME" --generate-notes --verify-tag
